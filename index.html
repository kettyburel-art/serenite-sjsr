<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sérénité Menus - Version Complète</title>

<style>
body {font-family:sans-serif;background:#faf6f3;padding:10px;}
h1{text-align:center;margin-bottom:10px;}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day {
  background:white;
  border-radius:10px;
  padding:6px;
  font-size:0.75rem;
}

.day strong {
  display:block;
}

.controls {
  margin:10px 0;
  text-align:center;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  margin:3px;
}

.hard {background:#fff6f8;}

.shopping {
  background:white;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

</style>
</head>

<body>

<h1>🌸 Sérénité</h1>

<div class="controls">
<button onclick="toggleHard()">💗 Journée douce</button>
<button onclick="generateMonth()">🔄 Recharger mois</button>
</div>

<div id="calendar" class="calendar"></div>

<div class="shopping">
<h3>🛒 Liste de courses</h3>
<ul id="shoppingList"></ul>
</div>

<script>

const meals = [
  {name:"Riz poulet", ingredients:["riz","poulet","légumes"]},
  {name:"Dahl lentilles", ingredients:["lentilles","coco","épices"]},
  {name:"Pâtes légumes", ingredients:["pâtes","tomate","légumes"]},
  {name:"Riz thon", ingredients:["riz","thon"]},
  {name:"Salade pois chiches", ingredients:["pois chiches","salade"]}
];

function toggleHard(){
 let h = localStorage.getItem("hard")==="true";
 localStorage.setItem("hard",!h);
 generateMonth();
}

function randomMeal(){
 return meals[Math.floor(Math.random()*meals.length)];
}

function generateMonth(){

 const cal = document.getElementById("calendar");
 const shop = new Set();
 cal.innerHTML="";

 let hard = localStorage.getItem("hard")==="true";

 for(let i=1;i<=30;i++){

   let meal = hard ? meals[2] : randomMeal();

   meal.ingredients.forEach(i=>shop.add(i));

   let div=document.createElement("div");
   div.className="day";
   div.innerHTML = `
     <strong>Jour ${i}</strong>
     🍽️ ${meal.name}<br>
     🌙 Soupe / yaourt
   `;
   cal.appendChild(div);
 }

 // shopping list
 let list=document.getElementById("shoppingList");
 list.innerHTML="";
 shop.forEach(item=>{
   let li=document.createElement("li");
   li.innerText=item;
   list.appendChild(li);
 });
}

generateMonth();

</script>

</body>
</html>
